<!DOCTYPE html>
<html>
<head>
<style>
    :root {
        --brain-color: #a29bfe;
        --tool-color: #00cec9;
        --text-color: #dfe6e9;
    }
    body { background-color: #0f1117; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 450px; font-family: sans-serif; margin: 0; }
    
    .react-container { display: flex; align-items: center; gap: 50px; position: relative; }
    
    .circle { width: 100px; height: 100px; border-radius: 50%; border: 3px solid; display: flex; align-items: center; justify-content: center; font-weight: bold; position: relative; }
    .brain-node { border-color: var(--brain-color); background: rgba(162, 155, 254, 0.1); }
    .tool-node { border-color: var(--tool-color); background: rgba(0, 206, 201, 0.1); }

    .pulse { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: inherit; opacity: 0; animation: pulse-ring 2s infinite; }
    @keyframes pulse-ring { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.5); opacity: 0; } }

    .arrow-path { position: absolute; width: 150px; height: 2px; background: #636e72; z-index: 1; }
    .data-packet { width: 10px; height: 10px; background: #ffeaa7; border-radius: 50%; position: absolute; top: -4px; offset-path: path('M 0 0 L 150 0'); animation: flow 3s infinite linear; }
    
    @keyframes flow {
        0% { left: 0; opacity: 0; }
        10%, 40% { opacity: 1; }
        50% { left: 100%; opacity: 0; }
        60%, 90% { left: 100%; opacity: 1; transform: scaleX(-1); } /* 簡化示意，實際上是用 animation 模擬往返 */
        100% { left: 0; opacity: 0; }
    }

    .log-box { margin-top: 40px; width: 300px; height: 100px; border: 1px solid #444; padding: 10px; font-size: 11px; color: #b2bec3; overflow: hidden; background: #1e272e; border-radius: 5px; }
    .typewriter { overflow: hidden; white-space: nowrap; border-right: 2px solid orange; animation: typing 3s steps(30, end) infinite; }
    @keyframes typing { from { width: 0 } to { width: 100% } }
</style>
</head>
<body>

    <h3 style="margin-bottom: 30px; letter-spacing: 1px;">ReAct: Reason + Act Loop</h3>

    <div class="react-container">
        <div class="circle brain-node">
            <div class="pulse"></div>
            🧠 Thought
        </div>

        <div style="width: 100px; height: 2px; background: #444; position: relative;">
            <div id="packet" style="position: absolute; width: 12px; height: 12px; background: #fdcb6e; border-radius: 50%; top: -5px; left: 0;"></div>
        </div>

        <div class="circle tool-node">
            🛠 Tool
        </div>
    </div>

    <div class="log-box">
        <div id="log-text" style="color: #55efc4;">[Thought]: I need to search...</div>
        <div style="color: #74b9ff;">[Action]: Google Search API</div>
        <div style="color: #fab1a0;">[Observation]: Result found...</div>
    </div>

    <script>
        const packet = document.getElementById('packet');
        const log = document.getElementById('log-text');
        const phrases = ["[Thought]: I need to search...", "[Action]: API Call...", "[Observation]: Data received!"];
        let i = 0;

        function animate() {
            packet.style.transition = "left 1.5s ease-in-out";
            packet.style.left = "100%";
            setTimeout(() => {
                packet.style.left = "0%";
                log.innerText = phrases[i % phrases.length];
                i++;
            }, 1500);
        }
        setInterval(animate, 3000);
        animate();
    </script>

    <p style="font-size: 11px; color: #bdc3c7; margin-top: 20px; text-align: center; line-height: 1.6;">
        <b>ReAct 流程：</b><br>
        1. <b>Thought</b>: 思考下一步 (大腦)<br>
        2. <b>Action</b>: 執行工具操作 (外部)<br>
        3. <b>Observation</b>: 觀察結果並回到思考。
    </p>

</body>
</html>
