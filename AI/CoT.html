<!DOCTYPE html>
<html>
<head>
<style>
    :root {
        --step-color: #a29bfe;
        --target-color: #facd05;
        --bg: #0f1117;
    }
    body { background-color: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 450px; font-family: sans-serif; margin: 0; }
    
    .staircase { width: 300px; height: 250px; position: relative; border-left: 2px solid #444; border-bottom: 2px solid #444; }

    /* 階梯步驟 */
    .step { position: absolute; background: var(--step-color); height: 4px; opacity: 0; width: 0; box-shadow: 0 0 10px var(--step-color); }
    
    @keyframes build-stair {
        0% { width: 0; opacity: 0; }
        20% { width: 60px; opacity: 1; }
        100% { width: 60px; opacity: 1; }
    }

    /* 執行球 */
    .ball { width: 12px; height: 12px; background: #fff; border-radius: 50%; position: absolute; bottom: 0; left: 0; opacity: 0; }

    @keyframes climbing {
        0% { bottom: 0; left: 0; opacity: 1; }
        20% { bottom: 50px; left: 60px; }
        40% { bottom: 100px; left: 120px; }
        60% { bottom: 150px; left: 180px; }
        80% { bottom: 200px; left: 240px; }
        100% { bottom: 200px; left: 240px; opacity: 0; transform: scale(1.5); }
    }

    .s1 { bottom: 50px; left: 0; animation: build-stair 5s infinite 0.5s; }
    .s2 { bottom: 100px; left: 60px; animation: build-stair 5s infinite 1s; }
    .s3 { bottom: 150px; left: 120px; animation: build-stair 5s infinite 1.5s; }
    .s4 { bottom: 200px; left: 180px; animation: build-stair 5s infinite 2s; }
    
    .active-ball { animation: climbing 5s infinite; }
    
    .goal { position: absolute; top: -10px; right: 0; font-size: 24px; animation: glow 5s infinite; }
    @keyframes glow { 0%, 80% { opacity: 0.3; } 85% { opacity: 1; text-shadow: 0 0 15px var(--target-color); } }
</style>
</head>
<body>

    <h3 style="margin-bottom: 30px; letter-spacing: 2px;">Chain of Thought: Logical Scaffolding</h3>

    <div class="staircase">
        <div class="step s1"></div>
        <div class="step s2"></div>
        <div class="step s3"></div>
        <div class="step s4"></div>
        <div class="ball active-ball"></div>
        <div class="goal">🎯</div>
    </div>

    <p style="font-size: 11px; color: #bdc3c7; margin-top: 40px; text-align: center; line-height: 1.6; max-width: 400px;">
        <b>思維鏈原理：</b><br>
        與其讓 AI 直接「瞬移」到目標 (容易出錯)，不如幫它鋪設<span style="color:var(--step-color)">邏輯階梯</span>。<br>
        每一層中間步驟都支撐著下一層，最終穩定達成<span style="color:var(--target-color)">正確目標</span>。
    </p>

</body>
</html>
