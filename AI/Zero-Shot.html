<!DOCTYPE html>
<html>
<head>
<style>
    :root {
        --zero-color: #ff7675;
        --few-color: #74b9ff;
        --target-color: #facd05;
    }
    body { background-color: #0f1117; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 400px; font-family: sans-serif; margin: 0; }
    
    .canvas { width: 350px; height: 200px; border: 1px solid #434c5e; border-radius: 12px; position: relative; overflow: hidden; background: rgba(255,255,255,0.02); }

    /* Zero-Shot: 一箭穿心 */
    .arrow-zero { position: absolute; left: 20px; top: 100px; height: 2px; background: var(--zero-color); width: 0; box-shadow: 0 0 10px var(--zero-color); animation: zero-fire 3s infinite ease-out; }
    .arrow-zero::after { content: 'Zero-Shot'; position: absolute; top: -15px; left: 0; font-size: 10px; color: var(--zero-color); }

    @keyframes zero-fire {
        0% { width: 0; opacity: 0; }
        20% { opacity: 1; }
        50%, 100% { width: 280px; opacity: 1; }
    }

    /* 目標點 */
    .target { position: absolute; right: 40px; top: 85px; font-size: 24px; z-index: 10; animation: target-hit 3s infinite; }
    @keyframes target-hit {
        0%, 45% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.3); opacity: 1; color: var(--target-color); }
        100% { transform: scale(1); opacity: 0.5; }
    }
</style>
</head>
<body>

    <h3 style="margin-bottom: 20px; letter-spacing: 1px;">Zero-Shot: Direct Inference</h3>

    <div class="canvas">
        <div class="arrow-zero"></div>
        <div class="target">🎯</div>
    </div>

    <p style="font-size: 11px; color: #bdc3c7; margin-top: 30px; text-align: center; line-height: 1.6; max-width: 400px;">
        <b>Zero-Shot 原理：</b><br>
        不提供任何範例參考，直接利用模型內部的<span style="color:var(--zero-color)">權重直覺</span>進行推斷。<br>
        雖然最簡單，但非常依賴模型本身的實力。
    </p>

</body>
</html>
