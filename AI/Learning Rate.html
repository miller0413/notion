<!DOCTYPE html>
<html>
<head>
<style>
    body { background-color: #0f1117; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 400px; font-family: sans-serif; }
    .valley { width: 300px; height: 150px; border: 2px solid #636e72; border-top: none; border-radius: 0 0 150px 150px; position: relative; overflow: hidden; margin-top: 20px; }
    .ball { width: 12px; height: 12px; border-radius: 50%; position: absolute; top: 0; }
    
    /* LR 太大：跳來跳去 */
    .ball-high { background: #ff7675; left: 10px; animation: high-lr 3s infinite; }
    /* LR 適中：平滑落地 */
    .ball-mid { background: #00b894; left: 10px; animation: mid-lr 3s infinite; }
    /* LR 太小：慢如蝸牛 */
    .ball-low { background: #0984e3; left: 10px; animation: low-lr 3s infinite; }

    @keyframes high-lr {
        0% { left: 10px; top: 10px; }
        25% { left: 250px; top: 30px; }
        50% { left: 30px; top: 60px; }
        75% { left: 280px; top: 10px; }
        100% { left: 10px; top: 10px; }
    }
    @keyframes mid-lr {
        0% { left: 10px; top: 10px; }
        100% { left: 144px; top: 130px; }
    }
    @keyframes low-lr {
        0% { left: 10px; top: 10px; }
        100% { left: 50px; top: 50px; }
    }
    .legend { display: flex; gap: 20px; margin-top: 20px; font-size: 12px; }
</style>
</head>
<body>
    <div style="font-weight: bold; font-size: 16px;">Learning Rate Impact</div>
    <div class="valley">
        <div class="ball ball-high"></div>
        <div class="ball ball-mid"></div>
        <div class="ball ball-low"></div>
    </div>
    <div class="legend">
        <div style="color:#ff7675">● Too High (Diverge)</div>
        <div style="color:#00b894">● Just Right (Converge)</div>
        <div style="color:#0984e3">● Too Low (Slow)</div>
    </div>
</body>
</html>
