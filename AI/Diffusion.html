<!DOCTYPE html><html><head><style>
    :root {
        --noise-color: #555;
        --image-color: #74b9ff;
        --bg: #1a1a1a;
    }
    body { background: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 400px; font-family: 'Segoe UI', sans-serif; margin: 0; }
    
    .canvas-container { position: relative; width: 200px; height: 200px; background: #333; border: 4px solid #444; border-radius: 12px; overflow: hidden; }
    
    .pixel { position: absolute; width: 10px; height: 10px; opacity: 0.8; transition: all 1.5s ease-in-out; }
    
    .controls { margin-top: 30px; font-size: 14px; color: #aaa; text-transform: uppercase; letter-spacing: 2px; }
    
    .step-counter { font-family: monospace; color: var(--image-color); margin-top: 10px; }
</style></head><body>

    <h3>Diffusion Denoising Process</h3>

    <div class="canvas-container" id="canvas"></div>
    
    <div class="controls" id="status">Step: Pure Noise</div>
    <div class="step-counter" id="steps">T = 1000</div>

    <script>
        const canvas = document.getElementById('canvas');
        const status = document.getElementById('status');
        const steps = document.getElementById('steps');
        const pixels = [];
        const size = 200;
        const pSize = 10;

        // Initialize pixels in random positions (Noise)
        for(let i=0; i < (size/pSize)**2; i++) {
            const p = document.createElement('div');
            p.className = 'pixel';
            p.style.left = Math.random() * 190 + 'px';
            p.style.top = Math.random() * 190 + 'px';
            p.style.backgroundColor = `hsl(${Math.random()*360}, 50%, 50%)`;
            canvas.appendChild(p);
            pixels.push(p);
        }

        function iterate() {
            let t = 1000;
            const timer = setInterval(() => {
                t -= 20;
                steps.innerText = `T = ${t}`;
                
                if (t > 700) {
                    status.innerText = "Denoising (Initial)...";
                } else if (t > 300) {
                    status.innerText = "Forming Structure...";
                    pixels.forEach((p, idx) => {
                        const row = Math.floor(idx / 20);
                        const col = idx % 20;
                        // Move slightly towards grid
                        p.style.left = (col * 10 + (Math.random()*20-10)) + 'px';
                        p.style.top = (row * 10 + (Math.random()*20-10)) + 'px';
                        p.style.borderRadius = "0px";
                        p.style.backgroundColor = '#74b9ff';
                    });
                } else if (t <= 0) {
                    status.innerText = "Final Image Generated";
                    pixels.forEach((p, idx) => {
                        const row = Math.floor(idx / 20);
                        const col = idx % 20;
                        p.style.left = (col * 10) + 'px';
                        p.style.top = (row * 10) + 'px';
                        p.style.opacity = "1";
                    });
                    clearInterval(timer);
                    setTimeout(reset, 3000);
                }
            }, 100);
        }

        function reset() {
            pixels.forEach(p => {
                p.style.left = Math.random() * 190 + 'px';
                p.style.top = Math.random() * 190 + 'px';
                p.style.backgroundColor = `hsl(${Math.random()*360}, 50%, 50%)`;
            });
            iterate();
        }

        iterate();
    </script>

    <p style="font-size: 11px; color: #666; margin-top: 30px; text-align: center;">
        模型並不直接畫圖，而是透過 <b>T 步去噪</b>，<br>逐步將混亂的像素排布引導回有意義的圖像分佈中。
    </p>
</body></html>
