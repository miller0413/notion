<!DOCTYPE html>
<html>
<head>
<style>
    body { background-color: #0f1117; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 350px; font-family: sans-serif; }
    .bar-container { display: flex; align-items: flex-end; gap: 10px; height: 150px; border-bottom: 2px solid #636e72; padding: 10px; }
    .bar { width: 25px; background: #0984e3; transition: all 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55); }
    .label { margin-top: 15px; font-weight: bold; color: #00cec9; }
    
    @keyframes normalize-flow {
        0% { height: 20px; }
        20% { height: 120px; background: #ff7675; } /* 數值激增 */
        50% { height: 80px; background: #fdcb6e; } /* 調整中 */
        80% { height: 60px; background: #00b894; } /* 歸一化完成 */
        100% { height: 60px; background: #00b894; }
    }
    .anim { animation: normalize-flow 4s infinite alternate; }
</style>
</head>
<body>
    <div class="label" id="status">LayerNorm: Stabilizing...</div>
    <div class="bar-container">
        <div class="bar anim" style="animation-delay: 0.1s"></div>
        <div class="bar anim" style="animation-delay: 0.3s"></div>
        <div class="bar anim" style="animation-delay: 0.5s"></div>
        <div class="bar anim" style="animation-delay: 0.2s"></div>
        <div class="bar anim" style="animation-delay: 0.4s"></div>
    </div>
    <p style="font-size: 12px; color: #bdc3c7; margin-top: 20px;">將變動劇烈的原始數據 (紅色) 轉換為穩定的分佈 (綠色)</p>
</body>
</html>
