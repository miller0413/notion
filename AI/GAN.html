<!DOCTYPE html><html><head><style>
    :root {
        --gen-color: #ff7675;
        --dis-color: #0984e3;
        --bg: #1e272e;
    }
    body { background: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 400px; font-family: 'Segoe UI', sans-serif; margin: 0; }
    
    .arena { display: flex; align-items: center; gap: 50px; position: relative; }
    
    .box { width: 100px; height: 100px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-weight: bold; position: relative; }
    
    .generator { border: 3px solid var(--gen-color); color: var(--gen-color); }
    .discriminator { border: 3px solid var(--dis-color); color: var(--dis-color); }
    
    .art { width: 40px; height: 40px; background: white; position: absolute; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 0 10px rgba(255,255,255,0.5); }
    
    @keyframes toss {
        0% { left: 50px; opacity: 0; transform: scale(0.5); }
        30% { opacity: 1; }
        70% { opacity: 1; }
        100% { left: 200px; opacity: 0; transform: scale(1.1); }
    }
    .active-art { animation: toss 2s infinite ease-in-out; }

    .feedback { position: absolute; top: -30px; font-size: 12px; color: #fab1a0; width: 150px; text-align: center; }
</style></head><body>

    <h3 style="margin-bottom: 50px;">GAN: Generator vs Discriminator</h3>

    <div class="arena">
        <div class="box generator">
            <span style="font-size: 10px;">GENERATOR</span>
            <div style="font-size: 20px;">🎨</div>
        </div>
        
        <div class="art active-art" id="artPiece">🖼️</div>

        <div class="box discriminator">
            <span style="font-size: 10px;">DISCRIMINATOR</span>
            <div style="font-size: 20px;">🔍</div>
        </div>
        
        <div class="feedback" id="msg">Feedback: Too fake!</div>
    </div>

    <script>
        const art = document.getElementById('artPiece');
        const msg = document.getElementById('msg');
        const emoji = ['🌫️', '⬛', '🖼️', '🎭', '👤', '👸'];
        const text = ["Too blurry!", "Wrong color!", "Better, but no.", "Almost real...", "Perfect!"];
        let i = 0;
        setInterval(() => {
            art.innerText = emoji[i % emoji.length];
            msg.innerText = "Feedback: " + text[i % text.length];
            i++;
        }, 2000);
    </script>

    <p style="font-size: 12px; color: #888; margin-top: 40px; text-align: center; max-width: 400px;">
        生成器不斷進化，直到能畫出<b>連判別器也無法識破</b>的作品。
    </p>
</body></html>
