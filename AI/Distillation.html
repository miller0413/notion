<!DOCTYPE html>
<html>
<head>
<style>
    :root {
        --teacher-color: #a29bfe;
        --student-color: #55efc4;
        --soft-color: #fdcb6e;
        --feat-color: #74b9ff;
    }
    body { background-color: #0f1117; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 450px; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
    
    .main-container { position: relative; display: flex; align-items: center; gap: 80px; }

    /* 模型容器樣式 */
    .model-card {
        border: 2px solid;
        border-radius: 16px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: rgba(255, 255, 255, 0.03);
        box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        position: relative;
    }
    .teacher { width: 140px; border-color: var(--teacher-color); }
    .student { width: 90px; border-color: var(--student-color); height: fit-content; align-self: center; }

    /* 模擬神經網絡層 */
    .layer { height: 12px; border-radius: 6px; background: rgba(255,255,255,0.1); width: 100%; position: relative; overflow: hidden; }
    .layer::after {
        content: '';
        position: absolute;
        top: 0; left: -100%;
        width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        animation: scan 2s infinite linear;
    }

    @keyframes scan { to { left: 100%; } }

    /* 知識傳輸粒子 */
    .particle {
        position: absolute;
        border-radius: 50%;
        filter: blur(1px);
        z-index: 10;
    }

    /* Soft Target 粒子路徑：老師底部 -> 學生底部 */
    .p-soft { background: var(--soft-color); width: 10px; height: 10px; box-shadow: 0 0 10px var(--soft-color); }
    @keyframes flow-soft {
        0% { transform: translate(120px, 120px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translate(250px, 50px); opacity: 0; }
    }

    /* Hidden State 粒子路徑：老師中間 -> 學生中間 */
    .p-feat { background: var(--feat-color); width: 8px; height: 8px; box-shadow: 0 0 10px var(--feat-color); border-radius: 2px; }
    @keyframes flow-feat {
        0% { transform: translate(120px, 60px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translate(250px, 20px); opacity: 0; }
    }

    .anim-soft { animation: flow-soft 3s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95); }
    .anim-feat { animation: flow-feat 3s infinite 1.5s cubic-bezier(0.45, 0.05, 0.55, 0.95); }

    .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; position: absolute; white-space: nowrap; }
</style>
</head>
<body>

    <h3 style="margin-bottom: 50px; letter-spacing: 2px; color: #eceff4;">DEEP KNOWLEDGE DISTILLATION</h3>

    <div class="main-container">
        <!-- Teacher Model -->
        <div class="model-card teacher">
            <div style="text-align: center; font-size: 12px; font-weight: bold; color: var(--teacher-color);">TEACHER (70B)</div>
            <div class="layer"></div>
            <div class="layer"></div>
            <div class="layer" style="background: rgba(116, 185, 255, 0.3);"></div> <!-- Feature source -->
            <div class="layer"></div>
            <div class="layer" style="background: rgba(253, 203, 110, 0.3);"></div> <!-- Soft target source -->
            
            <div class="particle p-soft anim-soft"></div>
            <div class="particle p-feat anim-feat"></div>
        </div>

        <!-- 中間說明文字 -->
        <div style="display: flex; flex-direction: column; gap: 40px;">
             <span class="tag" style="background: rgba(116, 185, 255, 0.2); color: var(--feat-color); position: relative;">Logic Transfer</span>
             <span class="tag" style="background: rgba(253, 203, 110, 0.2); color: var(--soft-color); position: relative;">Decision Mimic</span>
        </div>

        <!-- Student Model -->
        <div class="model-card student">
            <div style="text-align: center; font-size: 10px; font-weight: bold; color: var(--student-color);">STUDENT (7B)</div>
            <div class="layer"></div>
            <div class="layer"></div>
        </div>
    </div>

    <div style="margin-top: 50px; text-align: center; line-height: 1.6;">
        <span style="color: var(--feat-color); font-weight: bold;">● Hidden States:</span> 讓學生模仿老師的思考路徑 (中間層)<br>
        <span style="color: var(--soft-color); font-weight: bold;">● Soft Targets:</span> 讓學生吸收老師的機率直覺 (輸出層)
    </div>

</body>
</html>
